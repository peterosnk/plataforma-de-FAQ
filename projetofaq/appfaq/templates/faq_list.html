<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>faq demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
  <body>

    <form action="{% url 'faq_list' %}" method="post">
      {% csrf_token %}
        <input type="text" name="pergunta" placeholder="Digite o titulo da pergunta" class="mb-4">
        <br>
        <input type="text" name="descricao" placeholder="Digite a descricao da pergunta" class="mb-4">
        <br>
        <input type="text" name="solucao" placeholder="Digite a solucao da pergunta" class="mb-4">
        <br>
        <button type="submit">Enviar</button>
    </form>

    {% for faq in faqs %}
      <hr>
      <h3><strong>{{ faq.pergunta }}</strong></h3>
      <p>{{ faq.descricao }}</p>
      <p>Solução: {{ faq.solucao }}</p>
      <a href="{% url 'faq_edit' faq.id %}">Editar</a> | <a href="{% url 'faq_delete' faq.id %}">Excluir</a>
    {% endfor %}

  </body>
</html>
