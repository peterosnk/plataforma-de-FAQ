<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>faq demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
  <body>

    <form action="{% url 'faq_edit' faq.id %}" method="post">
      {% csrf_token %}
        <input type="text" name="pergunta" placeholder="Digite o titulo da pergunta" class="mb-4" value="{{ faq.pergunta }}">
        <br>
        <input type="text" name="descricao" placeholder="Digite a descricao da pergunta" class="mb-4" value="{{ faq.descricao }}">
        <br>
        <input type="text" name="solucao" placeholder="Digite a solucao da pergunta" class="mb-4" value="{{ faq.solucao }}">
        <br>
        <button type="submit">Salvar</button>
    </form>

  </body>
</html>
